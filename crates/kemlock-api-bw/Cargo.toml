[package]
name = "kemlock-api-bw"
description = "The Bitwarden API: answers as Vaultwarden 1.37.5 does, for Bitwarden apps, Kemlock and Amethystora Vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs.workspace = true
# Attachments arrive as multipart/form-data with one `data` part.
axum = { workspace = true, features = ["multipart"] }
kemlock-app.workspace = true
kemlock-crypto = { workspace = true, features = ["aws-lc"] }
kemlock-domain.workspace = true
# Not a workspace dependency yet: the root manifest is the merge session's to edit. Its cipher JSON
# (`apply_viewer`, `attachment_json`) is what imported ciphers are served with.
kemlock-vaultwarden = { path = "../kemlock-vaultwarden" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
kemlock-identity = { path = "../kemlock-identity" }
kemlock-store-sql.workspace = true
# The Vaultwarden fixture builder of kemlock-vaultwarden's tests (a SQLite database made by
# running Vaultwarden's migrations) is shared with the import test.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tower.workspace = true

[features]
# Public entry points for the cargo-fuzz targets in fuzz/ (src/fuzzing.rs). Never on in a release.
fuzzing = []

[lints]
workspace = true
