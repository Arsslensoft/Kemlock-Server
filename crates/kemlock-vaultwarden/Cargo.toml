[package]
name = "kemlock-vaultwarden"
description = "Reads a Vaultwarden server's data, diffs two copies of it and maps it to what Kemlock Server stores"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kemlock-domain.workspace = true
serde_json.workspace = true
# The same sqlx line sea-orm already pulls in (Cargo.lock has 0.9.1); this crate talks to
# Vaultwarden's database directly and read-only, so it names sqlx itself.
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "mysql"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
