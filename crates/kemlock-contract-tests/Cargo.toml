[package]
name = "kemlock-contract-tests"
description = "Contract tests: the Bitwarden API of Kemlock Server, held to what Vaultwarden 1.37.5 answers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Only tests and the small HTTP client they share. The tests talk HTTP to a server started in this
# process (kemlock-server's library entry point, a temporary SQLite database, Bitwarden compatibility
# on) or, with KEMLOCK_CONTRACT_URL set, to any server at that address: a real Vaultwarden 1.37.5 too,
# which is how the tests themselves are checked.

[lib]
name = "kemlock_contract_tests"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
base64 = "0.22.1"
bytes = "1.12.2"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
kemlock-server.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
