[package]
name = "kemlock-loadgen"
description = "kemlock-loadgen: seeds a server and drives the OPAQUE sign-ins and DPoP proofs that k6 cannot make"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kemlock-loadgen"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap = { version = "4.6.9", features = ["derive"] }
kemlock-api-kem.workspace = true
kemlock-app.workspace = true
kemlock-crypto = { workspace = true, features = ["aws-lc"] }
# Plain HTTP only: the performance rigs call the server directly, not through a proxy.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
