[package]
name = "kemlock-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
kemlock-crypto = { path = ".." }

# Its own workspace, as cargo-fuzz wants: the fuzz crate is built with sanitizers and is not part
# of the main workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "opaque_server"
path = "fuzz_targets/opaque_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opaque_client"
path = "fuzz_targets/opaque_client.rs"
test = false
doc = false
bench = false
