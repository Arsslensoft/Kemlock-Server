[package]
name = "kemlock-crypto"
description = "ML-KEM-1024 + X25519, ML-DSA-65 + Ed25519, AES-256-GCM, Argon2id, HKDF and OPAQUE, on aws-lc-rs natively and RustCrypto in WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aws-lc"]
# Native backend: aws-lc-rs. It also needs RustCrypto's `ml-kem`, for the one thing aws-lc-rs cannot
# do: expand a 64-byte ML-KEM seed (see `backend::mlkem_seed`). Nothing else comes from RustCrypto.
aws-lc = ["dep:aws-lc-rs", "dep:ml-kem"]
# The FIPS build: aws-lc-rs's `fips` feature (the AWS-LC FIPS module) serves everything the module
# certifies, and RustCrypto's `ml-dsa` serves ML-DSA-65, which no aws-lc-rs FIPS build offers (see
# `backend::mldsa_soft`). It needs aws-lc-rs built without its default `aws-lc-sys` backend, which
# the workspace manifest can't say for one build only: `docker/fips/overlay.sh` rewrites the
# aws-lc-rs and kemlock-crypto lines of a container copy of it. Never combine it with `rustcrypto`.
fips = ["aws-lc", "aws-lc-rs/fips", "dep:ml-dsa"]
# Pure-Rust backend, for WebAssembly and for cross-checking aws-lc.
rustcrypto = [
    "dep:aes-gcm",
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:hkdf",
    "dep:hmac",
    "dep:ml-dsa",
    "dep:ml-kem",
    "dep:p256",
    "dep:sha1",
    "dep:sha2",
    "dep:sha3",
    "dep:x25519-dalek",
]
# The test-vector generator (`kemlock-vectors`). It needs RustCrypto because only that backend can
# be driven by a seeded random source end to end.
vectors = ["rustcrypto", "dep:serde_json", "dep:hex", "dep:rand_chacha", "dep:kemlock-domain"]

[[bin]]
name = "kemlock-vectors"
path = "src/bin/kemlock-vectors.rs"
required-features = ["vectors"]

[dependencies]
argon2.workspace = true
opaque-ke.workspace = true
rand_core_06.workspace = true
# opaque-ke 4 is generic over digest 0.10, so OPAQUE's SHA-512 comes from sha2 0.10 whichever
# backend is on.
sha2-opaque.workspace = true
subtle.workspace = true
# NFC for the duplicate tags' normalisation.
unicode-normalization = "0.1.26"
zeroize.workspace = true

aws-lc-rs = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
# The device-approval phrase vectors come from the domain's own implementation.
kemlock-domain = { workspace = true, optional = true }
ml-dsa = { workspace = true, optional = true, features = ["zeroize"] }
ml-kem = { workspace = true, optional = true, features = ["zeroize"] }
p256 = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha3 = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
# The RustCrypto backend is always built for the tests, so the cross-backend checks run in the
# default (native) build and under `fips` too: these are the dependencies its feature turns on.
aes-gcm.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
ml-dsa = { workspace = true, features = ["zeroize"] }
ml-kem = { workspace = true, features = ["zeroize"] }
p256.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
x25519-dalek.workspace = true
hex.workspace = true
kemlock-domain.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true

[lints]
workspace = true
