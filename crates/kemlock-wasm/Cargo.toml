[package]
name = "kemlock-wasm"
description = "The web vault's crypto: kemlock-crypto on RustCrypto behind wasm-bindgen, keys held in WebAssembly memory only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-opt runs from web/scripts/build-wasm.sh, so wasm-pack leaves it alone.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
kemlock-crypto = { workspace = true, features = ["rustcrypto"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.130"
zeroize.workspace = true

# getrandom 0.4 draws from `crypto.getRandomValues` on wasm32-unknown-unknown only with this
# feature; kemlock-crypto's random source is getrandom.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
hex.workspace = true
wasm-bindgen-test = "0.3.80"

# The workspace lints, except that `unsafe_code` is denied rather than forbidden: wasm-bindgen's
# generated glue is unsafe, and src/wasm.rs allows that and nothing else.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
