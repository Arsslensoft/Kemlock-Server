[package]
name = "kemlock-store-sql"
description = "SQL repositories and migrations for SQLite, PostgreSQL and MySQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kemlock-domain.workspace = true
kemlock-app.workspace = true
# Seals two-step secrets under server.key and hashes refresh tokens, as the Bitwarden API does.
kemlock-crypto = { workspace = true, features = ["aws-lc"] }
kemlock-federation = { path = "../kemlock-federation" }
# The SQL side of the move from Vaultwarden: `SqlImportSink` implements its `ImportSink`.
# Not a workspace dependency yet: the root manifest is the merge session's to edit.
kemlock-vaultwarden = { path = "../kemlock-vaultwarden" }
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
time.workspace = true
uuid.workspace = true
tracing.workspace = true

[features]
# Test hooks (a held account lock for the race tests). Never enabled by the server; this crate's own
# tests turn it on through the dev-dependency on itself below.
test-support = []

[dev-dependencies]
tempfile = "3.27.0"
kemlock-store-sql = { path = ".", features = ["test-support"] }

[lints]
workspace = true
