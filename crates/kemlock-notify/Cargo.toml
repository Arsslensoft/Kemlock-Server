[package]
name = "kemlock-notify"
description = "Mail, live-sync fan-out between replicas, the Bitwarden notifications hub and the push relays"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kemlock-app.workspace = true
kemlock-domain.workspace = true
kemlock-store-sql.workspace = true
axum.workspace = true
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
rmpv = "1.3.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = "0.29.0"
tower.workspace = true

[lints]
workspace = true
