# Kemlock Server on Docker Compose. See docs/self-hosting.md.
#
#   docker compose up -d
#   docker compose logs kemlock     # the one-time setup code is printed on the first run
#
# Vaultwarden's image listens on port 80 as root; this one runs as non-root on 8080, so the
# container side of an old port mapping changes. The port is bound to loopback for a reverse
# proxy on the same host (deploy/proxy/ has examples for Caddy, Traefik, nginx and HAProxy).
services:
  kemlock:
    image: ghcr.io/arsslensoft/kemlock-server:1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DOMAIN: https://vault.example.com
      SIGNUPS_ALLOWED: "false"
      # The reverse proxy on this host reaches the container from the bridge network's gateway, an
      # address in 172.16.0.0/12, so without these two every client looks like the proxy: all of
      # them share one rate-limit budget and one connection allowance. Narrow the block to your
      # network's gateway (`docker network inspect`) if other containers share it. Have the proxy
      # drop any X-Forwarded-For the client sent (deploy/proxy/ does).
      IP_HEADER: X-Forwarded-For
      KEMLOCK_TRUSTED_PROXIES: 172.16.0.0/12
    volumes:
      - ./kemlock-data:/data
    ports:
      - 127.0.0.1:8080:8080
