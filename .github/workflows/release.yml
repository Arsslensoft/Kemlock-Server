name: release

# On a version tag: the multi-arch image (and the FIPS image), CycloneDX SBOMs, cosign keyless
# signatures by digest, SLSA provenance (the SLSA generator and GitHub attestations), a syft SBOM
# of the image, release binaries with checksums.
# On main: the same image under the `edge` and `testing` tags, signed, with no GitHub release.
#
# Repository settings this reads:
#   variables  DOCKERHUB_IMAGE (e.g. docker.io/arsslensoft/kemlock-server), QUAY_IMAGE
#              (e.g. quay.io/arsslensoft/kemlock-server): mirrors, skipped when empty;
#              KEMLOCK_FIPS_IMAGE=true: build the FIPS image (see docker/Dockerfile.fips)
#   secrets    DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, QUAY_USERNAME, QUAY_TOKEN: for the mirrors

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # On main only the newest merge publishes `edge`: a newer push cancels the older run. A tag
  # release (its own ref) and a manual run are never cancelled.
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  GHCR_IMAGE: ghcr.io/arsslensoft/kemlock-server
  # The workflow file's name (release.yml) is part of the signing identity that
  # docs/self-hosting.md prints; renaming it changes what `cosign verify` must be given.
  # Set the variable KEMLOCK_REQUIRE_WEB=true once web/ has landed, so a release can't go out without it.
  WITH_WEB: ${{ vars.KEMLOCK_REQUIRE_WEB == 'true' && 'true' || 'auto' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.plan.outputs.images }}
      epoch: ${{ steps.plan.outputs.epoch }}
      is_tag: ${{ steps.plan.outputs.is_tag }}
      version: ${{ steps.plan.outputs.version }}
      fips: ${{ steps.plan.outputs.fips }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: plan
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          QUAY_IMAGE: ${{ vars.QUAY_IMAGE }}
          FIPS: ${{ vars.KEMLOCK_FIPS_IMAGE }}
        run: |
          set -euo pipefail
          images="$GHCR_IMAGE"
          [ -z "$DOCKERHUB_IMAGE" ] || images="$images"$'\n'"$DOCKERHUB_IMAGE"
          [ -z "$QUAY_IMAGE" ] || images="$images"$'\n'"$QUAY_IMAGE"
          {
            echo "images<<EOF"; echo "$images"; echo "EOF"
            # The commit time is the SOURCE_DATE_EPOCH of every build, so a rebuild matches.
            echo "epoch=$(git log -1 --format=%ct)"
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "is_tag=true"; echo "version=${GITHUB_REF_NAME#v}"
            else
              echo "is_tag=false"; echo "version=testing"
            fi
            echo "fips=$([ "$FIPS" = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # The licence texts every image and archive carries (design, Distribution): generated once, here,
  # from the lockfiles of this commit, and downloaded by the jobs that build or package binaries.
  # It fails the release on a crate or package whose licence is not accepted or has no text.
  notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No build caches in a release job: a cache another run wrote must not reach release artifacts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install cargo-about
        run: cargo install --locked --version 0.9.3 --features cli cargo-about
      - name: Install the web vault's runtime packages
        run: |
          set -euo pipefail
          if [ -f web/package-lock.json ]; then
            (cd web && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          else
            echo "web/ has not landed: no web notices"
          fi
      - run: tools/third-party-notices.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  # The tests, against the lockfile the FIPS image will be built from.
  fips-tests:
    needs: plan
    if: needs.plan.outputs.fips == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Overlay aws-lc-rs 1.17.x with fips and run the suite
        run: |
          sh docker/fips/overlay.sh 1.17.4 "$RUNNER_TEMP/fips-out"
          # kemlock-wasm asks kemlock-crypto for its `rustcrypto` backend, which `fips` refuses to
          # compile beside, so the WebAssembly crate is not part of the FIPS build or its tests.
          cargo test --workspace --exclude kemlock-wasm --locked

  # One job per platform, all at once, each on its own runner: a Rust release build (fat LTO, one
  # codegen unit) takes a runner's every core, so seven of them on one runner took seven times as
  # long. Each job cross-compiles with Zig on an amd64 runner, as tools/verify.sh rebuilds it, and
  # pushes its image by digest. On a version tag it also writes the release archive of its
  # binaries, from the same build (the `binaries` target reuses the stage the image was built from).
  # The first four platforms must build. The best-effort ones (design, Distribution) may fail: the
  # release goes on without them, and `image` says which are missing.
  build:
    needs: [plan, notices]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: ${{ !matrix.required }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, target: x86_64-unknown-linux-musl, required: true }
          - { platform: linux/arm64, target: aarch64-unknown-linux-musl, required: true }
          - { platform: linux/arm/v7, target: armv7-unknown-linux-musleabihf, required: true }
          - { platform: linux/arm/v6, target: arm-unknown-linux-musleabihf, required: true }
          - { platform: linux/386, target: i686-unknown-linux-musl, required: false }
          - { platform: linux/ppc64le, target: powerpc64le-unknown-linux-musl, required: false }
          - { platform: linux/riscv64, target: riscv64gc-unknown-linux-musl, required: false }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # THIRD-PARTY-NOTICES.txt goes into the build context; the Dockerfile copies it into the image.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is pushed by digest only. Tags are added after the smoke tests and the
      # signature, so a tag never points at an image that has not started.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ needs.plan.outputs.epoch }}
            KEMLOCK_GIT_COMMIT=${{ github.sha }}
            WITH_WEB=${{ env.WITH_WEB }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Provenance and SBOM come from the SLSA generator and cosign below, not BuildKit.
          provenance: false
          sbom: false
      # The same build arguments, so every stage up to the binaries comes from the build above.
      - name: The release archive of the binaries
        if: needs.plan.outputs.is_tag == 'true'
        env:
          EPOCH: ${{ needs.plan.outputs.epoch }}
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker buildx build -f docker/Dockerfile --target binaries --platform "$PLATFORM" \
            --build-arg SOURCE_DATE_EPOCH="$EPOCH" --build-arg WITH_WEB="$WITH_WEB" \
            --build-arg KEMLOCK_GIT_COMMIT="$GITHUB_SHA" \
            --output type=local,dest=bin .
          name="kemlock-$VERSION-$TARGET"
          mkdir -p "pkg/$name" dist
          cp bin/kemlock-server bin/kemlock-cli LICENSE NOTICE THIRD-PARTY-NOTICES.txt README.md "pkg/$name/"
          # A fixed order, owner and time: the archive of the same binaries is the same bytes.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$EPOCH" \
            -C pkg -cf - "$name" | gzip -n -9 > "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.is_tag == 'true'
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: printf '%s %s\n' "$PLATFORM" "$DIGEST" > "digest-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}
          path: digest-${{ matrix.target }}.txt
          if-no-files-found: error

  # The platforms' images joined into one manifest list, pushed by its digest alone (no tag yet).
  # `buildx imagetools create` will only push to a tag, so it writes the list (--dry-run) and the
  # registry API takes it by digest, from the same bytes the digest is the hash of.
  image:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - id: join
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          declare -A built=()
          for f in digests/digest-*.txt; do
            read -r platform digest < "$f"
            built[$platform]="$digest"
          done
          for platform in linux/amd64 linux/arm64 linux/arm/v7 linux/arm/v6; do
            [ -n "${built[$platform]:-}" ] || { echo "the first-class platform $platform did not build" >&2; exit 1; }
          done
          for platform in linux/386 linux/ppc64le linux/riscv64; do
            [ -n "${built[$platform]:-}" ] || echo "::warning::$platform is best effort and did not build: the image leaves it out"
          done
          sources=()
          for platform in linux/amd64 linux/arm64 linux/arm/v7 linux/arm/v6 linux/386 linux/ppc64le linux/riscv64; do
            [ -z "${built[$platform]:-}" ] || sources+=("$GHCR_IMAGE@${built[$platform]}")
          done
          docker buildx imagetools create --dry-run "${sources[@]}" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          media_type="$(jq -r .mediaType index.json)"
          repo="${GHCR_IMAGE#ghcr.io/}"
          bearer="$(curl -fsS -u "$ACTOR:$TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull,push" | jq -r .token)"
          curl -fsS -X PUT -H "Authorization: Bearer $bearer" -H "Content-Type: $media_type" \
            --data-binary @index.json "https://ghcr.io/v2/$repo/manifests/$digest"
          docker buildx imagetools inspect "$GHCR_IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The first four architectures are first class: tested natively or under QEMU, and they must
  # start. The rest are best effort (design, Distribution): built and started under QEMU, and a
  # failure shows as a warning without blocking the release.
  smoke:
    needs: [plan, image]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, required: true }
          - { platform: linux/arm64, arch: arm64, required: true }
          - { platform: linux/arm/v7, arch: arm, required: true }
          - { platform: linux/arm/v6, arch: arm, required: true }
          - { platform: linux/386, arch: "386", required: false }
          - { platform: linux/ppc64le, arch: ppc64le, required: false }
          - { platform: linux/riscv64, arch: riscv64, required: false }
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.arch }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the image and ask /alive
        id: start
        continue-on-error: ${{ !matrix.required }}
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ needs.image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker volume create kdata >/dev/null
          docker run -d --name kemlock --platform "$PLATFORM" --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v kdata:/data \
            -e DOMAIN=http://localhost:8080 "$IMAGE" >/dev/null
          for _ in $(seq 1 90); do
            if docker exec kemlock /usr/local/bin/kemlock-server healthcheck 2>/dev/null; then
              echo "started on $PLATFORM"; exit 0
            fi
            sleep 2
          done
          docker logs kemlock
          echo "the container never answered /alive on $PLATFORM" >&2
          exit 1
      - name: Best-effort platform did not start
        if: steps.start.outcome == 'failure'
        run: echo "::warning::${{ matrix.platform }} is best effort and did not start under QEMU"
      - name: Size targets (binary, image on disk, pull size)
        if: matrix.required && (matrix.arch == 'amd64' || matrix.arch == 'arm64')
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ needs.image.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Design, Performance targets: binary <= 25 MiB, on disk <= 30 MiB, pull <= 15 MiB. The
          # first image that built was over them (37.3, 38.5 and 19.7 MiB on amd64), so the limits
          # are a guard just above that until #27 brings the image back to the targets.
          docker pull --platform "$PLATFORM" "$IMAGE" >/dev/null
          disk="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          cid="$(docker create --platform "$PLATFORM" "$IMAGE")"
          bin="$(docker cp "$cid:/usr/local/bin/kemlock-server" - | wc -c)"
          docker rm "$cid" >/dev/null
          manifest="$(docker buildx imagetools inspect "$IMAGE" --raw \
            | jq -r --arg a "$ARCH" '.manifests[] | select(.platform.architecture==$a and .platform.os=="linux") | .digest' | head -n1)"
          pull="$(docker buildx imagetools inspect "${IMAGE%@*}@$manifest" --raw | jq '[.config.size] + [.layers[].size] | add')"
          echo "kemlock-server $bin B (tar stream), image on disk $disk B, pull $pull B"
          [ "$bin" -le $((40*1024*1024)) ] || { echo "the binary is over 40 MiB (target 25, #27)" >&2; exit 1; }
          [ "$disk" -le $((42*1024*1024)) ] || { echo "the image on disk is over 42 MiB (target 30, #27)" >&2; exit 1; }
          [ "$pull" -le $((22*1024*1024)) ] || { echo "the pull size is over 22 MiB (target 15, #27)" >&2; exit 1; }

  sbom:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: CycloneDX SBOMs of the Rust tree
        run: |
          set -euo pipefail
          cargo install --locked --version 0.5.10 cargo-cyclonedx
          cargo cyclonedx --format json --spec-version 1.5 --override-filename kemlock-sbom
          mkdir -p sbom
          for crate in kemlock-server kemlock-cli; do
            f=""
            for candidate in "crates/$crate/kemlock-sbom.cdx.json" "crates/$crate/kemlock-sbom.json"; do
              if [ -f "$candidate" ]; then f="$candidate"; break; fi
            done
            [ -n "$f" ] || { echo "no SBOM written for $crate" >&2; exit 1; }
            cp "$f" "sbom/$crate.cdx.json"
          done
      - name: CycloneDX SBOM of the web vault's npm tree
        run: |
          set -euo pipefail
          if [ -f web/package-lock.json ]; then
            (cd web && npm sbom --sbom-format cyclonedx --omit dev --package-lock-only) > sbom/kemlock-web.cdx.json
          else
            echo "web/ has not landed: no npm SBOM"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json

  fips:
    needs: [plan, fips-tests, notices]
    if: needs.plan.outputs.fips == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # FIPS builds natively: the module is built from source with Go and CMake, and
          # glibc is its validated environment, so there is no cross toolchain to pin.
          - { platform: linux/amd64, runner: ubuntu-24.04, name: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, name: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.fips
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ needs.plan.outputs.epoch }}
            KEMLOCK_GIT_COMMIT=${{ github.sha }}
            WITH_WEB=${{ env.WITH_WEB }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: echo "$DIGEST" > "digest-$NAME.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fips-digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}.txt

  publish:
    needs: [plan, image, smoke, sbom, fips]
    # `fips` is skipped when the variable is off; the rest must have passed.
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.smoke.result == 'success' && needs.sbom.result == 'success' && (needs.fips.result == 'success' || needs.fips.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: the Fulcio certificate is tied to this workflow's identity
      attestations: write # GitHub attestations of the provenance and the SBOM
    outputs:
      digest: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ vars.DOCKERHUB_IMAGE != '' }}
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ vars.QUAY_IMAGE != '' }}
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # 1.4.2 never moves, 1.4 takes patches, 1 takes minor releases, latest is the newest
      # stable release, edge and testing follow main (design, Operations).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Tag the image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          ghcr_tags=(); other_tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in "$GHCR_IMAGE":*) ghcr_tags+=(-t "$tag") ;; *) other_tags+=("$tag") ;; esac
          done <<< "$TAGS"
          docker buildx imagetools create "${ghcr_tags[@]}" "$GHCR_IMAGE@$DIGEST"
          # Mirrors get the same manifest list under the same digest, so one signature covers all.
          for tag in "${other_tags[@]}"; do
            skopeo copy --all --preserve-digests "docker://$GHCR_IMAGE@$DIGEST" "docker://$tag"
          done

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Sign and attest by digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            ref="$image@$DIGEST"
            # Keyless: a short-lived Fulcio certificate for this workflow, logged in Rekor.
            cosign sign --yes "$ref"
            for sbom in sbom/*.cdx.json; do
              cosign attest --yes --type cyclonedx --predicate "$sbom" "$ref"
            done
          done <<< "$IMAGES"

      # GitHub attestations, verifiable with `gh attestation verify oci://... --repo ...`: the
      # build provenance (the workflow run and commit that made the image) and an SPDX SBOM of
      # what is inside it, made by syft from the pushed image. They sit beside the cosign
      # signature and the SLSA provenance below, and are stored in the registry.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the image (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true

  # The FIPS image: the two native digests joined into one manifest list, tagged <tag>-fips
  # (1.4.2-fips, 1.4-fips, 1-fips, latest-fips, testing-fips), and signed by digest.
  publish-fips:
    needs: [plan, fips, publish]
    if: ${{ !cancelled() && needs.plan.outputs.fips == 'true' && needs.fips.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fips-digest-*
          path: digests
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            suffix=-fips,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=testing,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Join, tag and sign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sources=(); for f in digests/digest-*.txt; do sources+=("$GHCR_IMAGE@$(tr -d '[:space:]' < "$f")"); done
          tag_args=(); first=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(-t "$tag"); [ -n "$first" ] || first="$tag"
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "$GHCR_IMAGE@$digest"

  # SLSA Build L3 provenance for the image: a hosted, isolated generator signs it, and no build
  # step here can reach the signing secret.
  provenance-image:
    needs: [plan, publish]
    permissions:
      actions: read
      id-token: write
      packages: write
    # The SLSA generator must be called by its release tag, not a commit SHA: the builder identity
    # in the provenance is the tag, and slsa-verifier rejects a SHA. So this is the one tag here.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ghcr.io/arsslensoft/kemlock-server
      digest: ${{ needs.publish.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # Release binaries. Linux comes from the `build` jobs above (the Dockerfile's `binaries` target,
  # the same stage the image is built from); the rest are native builds and best effort.
  binaries-native:
    needs: [plan, notices]
    if: needs.plan.outputs.is_tag == 'true'
    # Best effort (design, Distribution): a failure here does not block the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, ext: zip, exe: .exe }
          # FreeBSD amd64, cross-built with Zig. arm64 FreeBSD, OpenBSD and NetBSD are tier 3 in
          # Rust and need nightly -Zbuild-std, so they are not built yet.
          - { os: ubuntu-24.04, target: x86_64-unknown-freebsd, ext: tar.gz, zig: true }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      # The commit the binary reports on /kem/v1/config and links the source to (AGPL-3.0 section 13).
      KEMLOCK_GIT_COMMIT: ${{ github.sha }}
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/kemlock
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: NASM for aws-lc on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Zig for the FreeBSD cross build
        if: matrix.zig
        run: |
          pip install ziglang==0.15.2
          cargo install --locked --version 0.24.1 cargo-zigbuild
      - name: Web vault
        shell: bash
        run: |
          if [ -f web/package-lock.json ]; then
            (cd web && npm ci --include=dev --ignore-scripts --no-audit --no-fund && npm run build)
          else
            echo "web/ has not landed: building without the web vault"
          fi
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig || 'false' }}" = true ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} -p kemlock-server -p kemlock-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p kemlock-server -p kemlock-cli
          fi
      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          name="kemlock-$VERSION-${{ matrix.target }}"
          mkdir -p "pkg/$name" dist
          cp "target/${{ matrix.target }}/release/kemlock-server${{ matrix.exe }}" \
             "target/${{ matrix.target }}/release/kemlock-cli${{ matrix.exe }}" \
             LICENSE NOTICE THIRD-PARTY-NOTICES.txt README.md "pkg/$name/"
          if [ "${{ matrix.ext }}" = zip ]; then
            (cd pkg && 7z a -tzip "../dist/$name.zip" "$name")
          else
            tar -C pkg -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*

  # The release notes: the Conventional Commits since the previous tag, grouped by type (cliff.toml).
  notes:
    needs: plan
    if: needs.plan.outputs.is_tag == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the history back to the previous tag
          persist-credentials: false
      - id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  # Checksums, one signature per file (keyless, as for the image), and the SBOMs.
  assets:
    # The Linux archives come with `build`: `image` passed only if every first-class one built.
    needs: [plan, build, image, publish, binaries-native, sbom, notes]
    if: ${{ !cancelled() && needs.plan.outputs.is_tag == 'true' && needs.image.result == 'success' && needs.publish.result == 'success' && needs.notes.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release
      id-token: write # keyless signing
      attestations: write # GitHub build provenance of the files in SHA256SUMS
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - name: Attest the build provenance of every file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Sign every file
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      # The runner has the GitHub CLI; an action for this would be one more thing with write access
      # to the release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --notes-file notes/RELEASE_NOTES.md)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${flags[@]}"

  # SLSA Build L3 provenance for the files in SHA256SUMS; it attaches itself to the release.
  provenance-binaries:
    needs: assets
    permissions:
      actions: read
      id-token: write
      contents: write
    # The SLSA generator must be called by its release tag, not a commit SHA: the builder identity
    # in the provenance is the tag, and slsa-verifier rejects a SHA. So this is the one tag here.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.assets.outputs.hashes }}
      upload-assets: true
