name: ci

# The required gate for a pull request and for main. Branch protection requires the one job,
# `ci-ok`, which needs every other job here (see tools/repo-settings.sh).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked --exclude kemlock-contract-tests

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources

  notices:
    # The release ships the licence texts of every dependency (tools/third-party-notices.sh); this
    # fails a change that adds a licence about.toml does not accept, or a package without a text.
    # The docker job copies the file into the image, which refuses to build without it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install cargo-about
        run: cargo install --locked --version 0.9.3 --features cli cargo-about
      - name: Install the web vault runtime packages
        run: |
          set -euo pipefail
          if [ -f web/package-lock.json ]; then
            (cd web && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          fi
      - run: tools/third-party-notices.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 3

  vectors:
    # The CC0 test vectors are generated, never edited by hand: regenerate
    # them and fail if anything differs from what is committed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run --locked -p kemlock-crypto --features vectors --bin kemlock-vectors -- --out test-vectors
      - run: cargo run --locked -p kemlock-federation --features vectors --bin kemlock-fed-vectors -- --out test-vectors
      - run: git diff --exit-code -- test-vectors

  vet:
    # Every dependency needs a recorded audit (supply-chain/): imported from Mozilla, Google, the
    # Bytecode Alliance, ISRG and Zcash, or ours, or listed as an exemption to audit over time.
    # --locked fails when imports.lock is out of date: run `cargo vet regenerate imports`.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-vet
      - run: cargo vet --locked

  # The WebAssembly modules the web vault loads, built by the Dockerfile's `wasm` stage, which
  # pins wasm-pack, wasm-opt and the Rust toolchain, so they are what a release holds.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: wasm-out
          push: false
          outputs: type=local,dest=wasm-pkg
          cache-from: type=gha,scope=ci-wasm
          cache-to: type=gha,mode=max,scope=ci-wasm,ignore-error=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: wasm-pkg
          if-no-files-found: error
          retention-days: 3

  web:
    # Types, unit tests, and the production build. `npm run build` runs tsc, vite build, the
    # precompression and the 250 KiB sign-in bundle budget (web/scripts/check-budget.ts).
    needs: wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: wasm-pkg
      - name: Put the WebAssembly packages where the web vault imports them
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf web/src/crypto/pkg web/src/import/pkg
          cp -a wasm-pkg/crypto web/src/crypto/pkg
          cp -a wasm-pkg/import web/src/import/pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    # The Playwright journeys against a debug kemlock-server that serves the built web vault from
    # web/dist. web/e2e/global-setup.ts starts the binary (KEMLOCK_BIN, default target/debug) on
    # a fresh data folder and reads the setup code from its log.
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p kemlock-server --features web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright's Chromium
        working-directory: web
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run the journeys
        working-directory: web
        env:
          KEMLOCK_BIN: ${{ github.workspace }}/target/debug/kemlock-server
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    needs: notices
    # Build the real image (amd64, with the web vault) and start it as the release does:
    # read-only, no capabilities, non-root. It must answer /alive.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: WITH_WEB=true
          load: true
          push: false
          tags: kemlock-server:ci
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker,ignore-error=true
      - name: Start the image and ask /alive
        run: |
          set -euo pipefail
          docker volume create kdata >/dev/null
          docker run -d --name kemlock --read-only --cap-drop ALL             --security-opt no-new-privileges:true -v kdata:/data             -p 127.0.0.1:8080:8080 -e DOMAIN=http://localhost:8080 kemlock-server:ci >/dev/null
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/alive; then
              echo; echo "answered /alive"; exit 0
            fi
            sleep 2
          done
          docker logs kemlock
          echo "the container never answered /alive" >&2
          exit 1
      - name: The server's log
        if: always()
        run: docker logs kemlock || true

  web-licenses:
    # Production npm dependencies stay on the licence allow-list that deny.toml sets for the Rust
    # tree (tools/check-web-licenses.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: tools/check-web-licenses.sh

  ci-ok:
    # The one check branch protection requires: it passes only when every job above passed.
    if: always()
    needs: [fmt, clippy, test, deny, notices, vectors, vet, web-licenses, wasm, web, e2e, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "(.key): (.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
