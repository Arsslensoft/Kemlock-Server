name: scorecard

# OpenSSF Scorecard (https://scorecard.dev) rates the repository's own supply-chain practice:
# pinned actions, token permissions, branch protection, signed releases, fuzzing. Weekly and on
# every push to main; the SARIF goes to the Security tab, and the public result feeds the badge.
# Scorecard only runs on the default branch of a public repository.

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 3"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF
      id-token: write # publish the result to scorecard.dev (OIDC)
      actions: read
      # Job permissions replace the workflow's read-all, and Scorecard's commit query also reads
      # the pull requests, issues and checks linked to each commit.
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard
