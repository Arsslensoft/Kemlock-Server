name: labeler

# Labels a pull request by the paths it changes (.github/labeler.yml). pull_request_target gives
# the token write access to the labels even on a fork's pull request; it is safe because the
# workflow never checks out or runs the pull request's code: the action reads the list of changed
# files through the API and the configuration from the base branch.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the configuration
      pull-requests: write # the labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
