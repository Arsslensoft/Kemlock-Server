name: workflow lint

# The workflows are code that holds the release signing identity, so they are linted like code:
# actionlint for syntax, expressions and shell (shellcheck runs on every run script), and zizmor
# for security (injection, excess permissions, unpinned actions, cache poisoning, credentials
# kept in .git/config). zizmor's rules are tuned in .github/zizmor.yml.

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          shellcheck: true
          fail-on-error: true

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without advanced-security the findings fail this job and show as annotations, which works
      # for fork and Dependabot pull requests (their token cannot upload code scanning results).
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          advanced-security: false
