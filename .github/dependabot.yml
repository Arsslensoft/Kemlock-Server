# Dependabot: weekly version updates, minor and patch grouped into one pull request per ecosystem,
# a major version on its own. Security updates are not grouped (the `groups` below apply to
# version updates only), so a fix for an advisory is one small pull request, opened at once.
# A new release waits a week (cooldown) before a version update proposes it, which gives
# a malicious or broken release time to be pulled; security updates ignore the cooldown.
# Patch and minor pull requests for test-only tooling (the docker-compose entry and the bw-cli and
# gen-api npm entries) merge by themselves once CI passes (dependabot-auto-merge.yml). Cargo, web
# npm, GitHub Actions and Docker base images are on the release path and wait for a maintainer.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    ignore:
      # age 0.12 pulls a pre-release ml-kem whose kem crate clashes with ours (Cargo.toml).
      - dependency-name: age
        versions: [">=0.12"]
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The OpenAPI type generator (web/tools/gen-api), kept apart from web/ because openapi-typescript
  # accepts TypeScript 5 only: TypeScript majors wait until it takes them.
  - package-ecosystem: npm
    directory: /web/tools/gen-api
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, javascript]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
  # The web vault is built into the release image: its updates wait for a maintainer.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  # The Bitwarden CLI the contract tests run against: not shipped, so its patch and minor updates
  # may auto-merge (dependabot-auto-merge.yml). Apart from /web so the two never share a pull request.
  - package-ecosystem: npm
    directory: /crates/kemlock-contract-tests/bw-cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      bw-cli-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The base images are pinned by digest in docker/Dockerfile (and Dockerfile.fips): Dependabot
  # moves the tag and the digest together.
  - package-ecosystem: docker
    directories:
      - /docker
      - /deploy/home-assistant/kemlock-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # The end-to-end Keycloak (deploy/e2e) and the single sign-on gate: images the tests run against,
  # not shipped. Their realm exports are made for one Keycloak major, so only minor and patch.
  - package-ecosystem: docker-compose
    directories:
      - /deploy/e2e
      - /tools/sso-gate
    # Wait after a release before proposing it, as the other ecosystems do (zizmor
    # dependabot-cooldown).
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
