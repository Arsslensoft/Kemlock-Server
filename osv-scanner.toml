# Advisories OSV (and OpenSSF Scorecard, which reads this file) reports that do not affect Kemlock
# Server. The same ids, with the same reasons, are in .cargo/audit.toml and deny.toml.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin attack: the server only verifies RSA signatures (openidconnect, webauthn); pgp decrypts client-side on the user's own file. No fixed rsa reaches these crates."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5 timing: reached through pgp in the client-side importer (pgp 0.21.1 is the newest release) and, in the server, through opaque-ke 4.0.1 then ecdsa and elliptic-curve 0.13.8. Not exploitable as configured: the OPAQUE suite is Ristretto255 on curve25519-dalek, and voprf uses elliptic-curve only for hash2curve message expansion, with no bigint arithmetic on secrets. Review this ignore if the OPAQUE suite moves to a P-256 curve."

