# cargo-deny: licences, advisories, duplicate crypto crates and sources.
# See the design's Security section, "Rust".

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# The same ids, with the same reasons, as .cargo/audit.toml.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack: the server only verifies RSA signatures; pgp decrypts client-side on the user's own file" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing: reached only via pgp in the client-side importer; pgp 0.21.1 is the newest" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained, no fixed release" },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no fixed release" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained, no fixed release" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained, no fixed release" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Everything here can be combined into an AGPL-3.0 work.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates (publish = false) name each other by path, which has no version to pin.
# Every registry dependency still needs one.
allow-wildcard-paths = true
# One copy of each primitive we rely on: a second version of a crypto crate
# means two implementations to audit.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
