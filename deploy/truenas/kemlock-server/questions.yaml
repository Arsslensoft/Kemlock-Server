groups:
  - name: Kemlock Configuration
    description: How the server presents itself to clients.
  - name: Network Configuration
    description: How the server is reached.
  - name: Storage Configuration
    description: Where the vault's data lives.
  - name: Resources Configuration
    description: Limits for the container.

questions:
  - variable: kemlock
    label: ""
    group: Kemlock Configuration
    schema:
      type: dict
      attrs:
        - variable: domain
          label: Domain
          description: >-
            The public address clients use, such as https://vault.example.com. Required behind a
            proxy: sign-in proofs are checked against it.
          schema:
            type: string
            required: true
        - variable: signups_allowed
          label: Allow Sign-ups
          description: Let anyone who can reach the server make an account.
          schema:
            type: boolean
            default: false
        - variable: ip_header
          label: Client IP Header
          description: Behind a proxy, the header that carries the client address, such as X-Forwarded-For.
          schema:
            type: string
            default: ""
        - variable: trusted_proxies
          label: Trusted Proxies
          description: Comma-separated proxy addresses the client IP header is trusted from.
          schema:
            type: string
            default: ""
        - variable: additional_envs
          label: Additional Environment Variables
          description: Any other Vaultwarden or KEMLOCK_ setting.
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: Web Port
          description: The API, the web vault and both WebSocket routes, on one port.
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: published
                  enum:
                    - value: published
                      description: Publish port on the host for external access
                    - value: exposed
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 31080
                  min: 9000
                  max: 65535
                  required: true
        - variable: host_network
          label: Host Network
          description: Bind to the host network. Usually not needed.
          schema:
            type: boolean
            default: false

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Data Storage
          description: The database, server.key, attachments and backups. Back up server.key apart from the data.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  default: ix_volume
                  enum:
                    - value: host_path
                      description: Host Path (Path that already exists on the system)
                    - value: ix_volume
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  attrs:
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        default: data
                        hidden: true
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: path
                      label: Host Path
                      schema:
                        type: hostpath
                        required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for the app.
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for the app.
                schema:
                  type: int
                  default: 512
                  required: true
