# nginx in front of Kemlock. Put this in /etc/nginx/conf.d/ and add your certificate:
#   listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;   (certbot --nginx does it)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kemlock {
    server kemlock:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # The file limit: attachments stream through, so this is the largest one allowed.
    client_max_body_size 1g;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    # Large bodies go straight through instead of being buffered to disk.
    proxy_request_buffering off;

    location / {
        proxy_pass http://kemlock;
    }

    # The two WebSocket routes: HTTP/1.1, the Upgrade and Connection headers, and a long read
    # timeout so an idle socket stays open.
    location = /notifications/hub {
        proxy_pass http://kemlock;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /kem/v1/live {
        proxy_pass http://kemlock;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
