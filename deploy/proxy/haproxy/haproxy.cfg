# HAProxy in front of Kemlock. For TLS: bind :443 ssl crt /etc/haproxy/certs/vault.pem
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  1m
    timeout server  1m
    # WebSockets are tunnels once upgraded: this is how long an idle one stays open.
    timeout tunnel  1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend web
    bind :80
    # Drop any X-Forwarded-For the client sent, so the only one Kemlock sees is the line HAProxy adds.
    http-request del-header X-Forwarded-For
    option forwardfor
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    default_backend kemlock

backend kemlock
    option httpchk
    http-check send meth GET uri /alive
    server kemlock kemlock:8080 check resolvers docker init-addr libc,none
